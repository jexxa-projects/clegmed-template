# copier.yml
_min_copier_version: "9.0"

_subdirectory: "template"
_templates_suffix: ""

project_name:
  type: str
  help: "Name of your project? (e.g., clegmed-app)"
  default: "clegmed-app"
  validate: "^[a-zA-Z0-9_-]+$"

author_name:
  type: str
  help: "Name of the developer/ogranization?"
  default: "Unknown"

vcs_repository:
  type: str
  help: "URL of the repository?"
  # Generiert automatisch: https://github.com
  default: "https://github.com/{{ author_name }}/{{ project_name }}"

docker_registry:
  type: str
  help: "Name of the docker registry?"
  default: "ghcr.io"
